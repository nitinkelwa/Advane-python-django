<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% include 'header.html' %}
<br><br><br>
<div align="center">
    <form method="POST">
        <h1>User Login</h1>
        <font color="red"><h3>{{message}}</h3></font>
        {% csrf_token %}
        <table>
            <tr>
                <th>Login Id</th>
                <td><input type="text" name="loginId"></td>
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="text" name="password"></td>
            </tr>
            <tr>
                <th></th>
                <td><input type="submit" name="signIn"></td>
            </tr>
        </table>

    </form>
</div>

</body>
</html>
