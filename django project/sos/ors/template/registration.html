<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% include "Header.html"%}
<form method="POST">
    {% csrf_token %}
    <div align="center">
        <h1> User registration form</h1>

        <table>
            <tr>
                <th>first Name:</th>
                <td><input type="text" name="firstName"></td>
            </tr>
            <tr>
                <th>last Name:</th>
                <td><input type="text" name="lastName"></td>
            </tr>
            <tr>
                <th>login Id:</th>
                <td><input type="text" name="loginId"></td>
            </tr>
            <tr>
                <th>password:</th>
                <td><input type="text" name="password"></td>
            </tr>
            <tr>
                <th>dob:</th>
                <td><input type="date" name="dob" style="width:97.5%"></td>
            </tr>
            <tr>
                <th>address:</th>
                <td><input type="text" name="address"></td>
            </tr>
            <tr>
                <th></th>
                <td><input type="submit" name="operation" value="signup"></td>
            </tr>

        </table>
    </div>
</form>
</body>
</html>
